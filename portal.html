<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RCG Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   RCG PORTAL — Design System
   Dark terminal aesthetic · Ownership-minded operators
═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:       #0f0f0f;
  --surface:  #161616;
  --surface2: #1e1e1e;
  --border:   #242424;
  --border2:  #2e2e2e;
  --text:     #f0ede8;
  --muted:    #888880;
  --dim:      #444440;
  --red:      #9E0D00;
  --red2:     #b31200;
  --red-dim:  rgba(158,13,0,.1);
  --green:    #3a8f5a;
  --amber:    #b07800;
  --signal:   #c04040;
  --display:  'Cormorant Garamond', serif;
  --body:     'Inter', sans-serif;
  --mono:     'DM Mono', monospace;
  --sidebar:  240px;
  --radius:   0px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Layout ────────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ───────────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  position:relative;z-index:100;
}
.sb-brand{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.sb-wm{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--text)}
.sb-wm span{color:var(--red)}
.sb-tagline{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:.2rem}
.sb-agent{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;cursor:pointer}
.sb-agent:hover{background:var(--surface2)}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-agent-info{overflow:hidden}
.sb-agent-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-agent-tier{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:.75rem 0}
.sb-section{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:.5rem 1.25rem .25rem;margin-top:.5rem}
.sb-link{display:flex;align-items:center;gap:.625rem;padding:.625rem 1.25rem;cursor:pointer;transition:background .12s,color .12s;color:var(--muted);font-size:12.5px;font-weight:400;position:relative}
.sb-link:hover{background:var(--surface2);color:var(--text)}
.sb-link.active{background:var(--red-dim);color:var(--text)}
.sb-link.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red)}
.sb-link .icon{width:15px;text-align:center;font-size:13px;flex-shrink:0;opacity:.7}
.sb-link.active .icon{opacity:1}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:999px;min-width:18px;text-align:center}
.sb-footer{padding:1rem 1.25rem;border-top:1px solid var(--border)}
.sb-logout{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:.5rem}
.sb-logout:hover{color:var(--muted)}

/* ── Main content ──────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.75rem;gap:1rem;flex-shrink:0;background:var(--surface)}
.topbar-title{font-size:13px;font-weight:500;color:var(--text);flex:1}
.topbar-actions{display:flex;gap:.625rem}
.content{flex:1;overflow-y:auto;padding:1.75rem}

/* ── Cards ─────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);padding:1.5rem}
.card-sm{background:var(--surface);border:1px solid var(--border);padding:1.1rem 1.25rem}
.card-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.875rem}

/* ── Buttons ───────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.625rem 1.1rem;font-family:var(--body);font-size:11.5px;font-weight:500;letter-spacing:.06em;cursor:pointer;border:none;transition:background .12s,color .12s;-webkit-appearance:none;white-space:nowrap}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red2)}
.btn-primary:disabled{background:var(--surface2);color:var(--dim);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-danger{background:var(--signal);color:#fff}
.btn-danger:hover{background:#a03030}
.btn-sm{padding:.4rem .75rem;font-size:10.5px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;font-size:14px}

/* ── Forms ─────────────────────────────────────────────────── */
.field{margin-bottom:1.1rem}
.field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-family:var(--body);font-size:13.5px;
  padding:.65rem .875rem;transition:border-color .15s;
  -webkit-appearance:none;border-radius:0;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field select option{background:var(--surface2)}
.field textarea{resize:vertical;min-height:80px}
.field-hint{font-size:11px;color:var(--dim);margin-top:.3rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.field-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.field-calc{background:var(--bg);border:1px solid var(--border);padding:.65rem .875rem;font-family:var(--mono);font-size:13px;color:var(--green)}

/* ── Toggle chips ──────────────────────────────────────────── */
.chip-group{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.chip{padding:.35rem .75rem;border:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .12s;user-select:none}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.selected{background:var(--red);border-color:var(--red);color:#fff}

/* ── Badges ────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .5rem}
.badge-active{background:rgba(58,143,90,.12);color:var(--green)}
.badge-caution{background:rgba(176,120,0,.12);color:var(--amber)}
.badge-blacklist{background:rgba(192,64,64,.12);color:var(--signal)}
.badge-inactive{background:var(--surface2);color:var(--dim)}
.badge-tier{background:var(--red-dim);color:var(--red);border:1px solid rgba(158,13,0,.2)}
.badge-admin{background:rgba(255,255,255,.06);color:var(--text)}

/* ── Progress bars ─────────────────────────────────────────── */
.prog-wrap{margin-bottom:.5rem}
.prog-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.prog-label{font-size:12px;color:var(--muted)}
.prog-values{font-family:var(--mono);font-size:11px;color:var(--text)}
.prog-bar{height:3px;background:var(--border2);position:relative;overflow:hidden}
.prog-fill{height:100%;background:var(--red);transition:width .6s cubic-bezier(.16,1,.3,1)}
.prog-fill.green{background:var(--green)}

/* ── Stat blocks ───────────────────────────────────────────── */
.stat-block{text-align:center;padding:1.25rem 1rem}
.stat-val{font-family:var(--display);font-size:clamp(32px,4vw,48px);font-weight:600;color:var(--text);line-height:1;margin-bottom:.25rem}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:.2rem}

/* ── Tables ────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:.625rem 1rem;border-bottom:1px solid var(--border);font-weight:400}
.tbl td{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface2);color:var(--text)}
.tbl-primary{color:var(--text)!important;font-weight:500}

/* ── Carrier card ──────────────────────────────────────────── */
.carrier-card{background:var(--surface);border:1px solid var(--border);padding:1.25rem;transition:border-color .15s;cursor:pointer;position:relative}
.carrier-card:hover{border-color:var(--border2)}
.carrier-card.blacklisted{border-color:rgba(192,64,64,.3);background:rgba(192,64,64,.03)}
.carrier-card.caution{border-color:rgba(176,120,0,.3)}
.carrier-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:.3rem}
.carrier-meta{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.875rem}
.carrier-stats{display:flex;gap:.875rem;align-items:center}
.carrier-stat{text-align:center}
.carrier-stat-val{font-family:var(--display);font-size:22px;font-weight:600;color:var(--text);line-height:1}
.carrier-stat-lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:.1rem}
.carrier-actions{position:absolute;top:1rem;right:1rem;display:flex;gap:.4rem}
.carrier-warning{background:rgba(192,64,64,.08);border:1px solid rgba(192,64,64,.2);padding:.625rem .875rem;margin-top:.875rem;font-size:12px;color:#d08080;line-height:1.5}
.carrier-caution-note{background:rgba(176,120,0,.08);border:1px solid rgba(176,120,0,.2);padding:.625rem .875rem;margin-top:.875rem;font-size:12px;color:#c8a050;line-height:1.5}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast-item{background:var(--surface);border:1px solid var(--border);padding:.75rem 1.1rem;font-size:12.5px;color:var(--text);max-width:320px;animation:toastIn .25s cubic-bezier(.16,1,.3,1);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-item.ok{border-left:2px solid var(--green)}
.toast-item.err{border-left:2px solid var(--signal)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Modal ─────────────────────────────────────────────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:1.5rem}
#modal-overlay.open{display:flex}
#modal-box{background:var(--surface);border:1px solid var(--border2);padding:2rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative}
.modal-title{font-size:16px;font-weight:500;color:var(--text);margin-bottom:1.25rem;padding-right:2rem}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:.25rem}
.modal-close:hover{color:var(--text)}

/* ── Login screen ──────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1.5rem}
.login-box{width:100%;max-width:380px}
.login-wm{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.4rem}
.login-wm span{color:var(--red)}
.login-title{font-family:var(--display);font-size:32px;font-weight:600;color:var(--text);line-height:1.1;margin-bottom:.5rem}
.login-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.login-error{background:var(--red-dim);border:1px solid rgba(158,13,0,.3);padding:.75rem 1rem;font-size:12.5px;color:#d08080;margin-bottom:1rem;display:none}
.login-footer{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:1.5rem;text-align:center}

/* ── Profile hero ──────────────────────────────────────────── */
.profile-hero{background:var(--surface);border:1px solid var(--border);padding:2rem;display:flex;align-items:center;gap:1.75rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.profile-hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.profile-photo{width:72px;height:72px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;font-size:18px;border-radius:50%}
.profile-photo:hover .profile-photo-overlay{display:flex}
.profile-info{flex:1}
.profile-name{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:600;color:var(--text);line-height:1.1;margin-bottom:.3rem}
.profile-title{font-size:13px;color:var(--muted);margin-bottom:.5rem}
.profile-badges{display:flex;gap:.5rem;flex-wrap:wrap}

/* ── Goals grid ────────────────────────────────────────────── */
.goals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin-bottom:1.5rem}
.goal-period{background:var(--surface);padding:1.25rem 1rem}
.goal-period-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:1rem}

/* ── Quick actions ─────────────────────────────────────────── */
.quick-actions{display:flex;gap:.875rem;margin-bottom:1.5rem;flex-wrap:wrap}
.qa-btn{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--border);padding:1.1rem 1.25rem;cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.qa-btn:hover{border-color:var(--border2);background:var(--surface2)}
.qa-btn .qa-icon{font-size:20px;margin-bottom:.5rem;display:block}
.qa-btn .qa-label{font-size:12.5px;font-weight:500;color:var(--text);display:block;margin-bottom:.15rem}
.qa-btn .qa-desc{font-size:11px;color:var(--dim)}

/* ── Lane search ───────────────────────────────────────────── */
.search-bar{background:var(--surface);border:1px solid var(--border);padding:1.25rem;display:flex;gap:.875rem;align-items:flex-end;margin-bottom:1.5rem;flex-wrap:wrap}
.search-bar .field{margin:0;flex:1;min-width:140px}
.search-results{display:flex;flex-direction:column;gap:.75rem}
.no-results{text-align:center;padding:3rem;color:var(--dim);font-size:13px}
.results-header{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center}

/* ── Tasks ─────────────────────────────────────────────────── */
.task-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-check{width:16px;height:16px;border:1px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.task-check.done{background:var(--green);border-color:var(--green)}
.task-check.done::after{content:'✓';font-size:10px;color:#fff}
.task-text{flex:1;font-size:13px}
.task-text.done{text-decoration:line-through;color:var(--dim)}
.task-due{font-family:var(--mono);font-size:10px;color:var(--dim)}
.task-priority-high{border-left:2px solid var(--signal);padding-left:.75rem}
.task-priority-urgent{border-left:2px solid var(--red);padding-left:.75rem}

/* ── Empty states ──────────────────────────────────────────── */
.empty{text-align:center;padding:3rem 1.5rem;color:var(--dim)}
.empty-icon{font-size:32px;margin-bottom:.75rem;opacity:.4}
.empty-text{font-size:13px;line-height:1.6;margin-bottom:1.25rem}

/* ── Admin ─────────────────────────────────────────────────── */
.agent-row{display:flex;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--border);gap:1rem;transition:background .12s}
.agent-row:hover{background:var(--surface2)}
.agent-toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.agent-toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--border2);cursor:pointer;transition:background .15s;border-radius:10px}
.toggle-slider::before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;transition:transform .15s;border-radius:50%}
.agent-toggle input:checked+.toggle-slider{background:var(--green)}
.agent-toggle input:checked+.toggle-slider::before{transform:translateX(16px)}

/* ── Mobile ────────────────────────────────────────────────── */
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.mob-nav-items{display:flex}
.mob-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.625rem .5rem;cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;transition:color .12s}
.mob-nav-item.active{color:var(--red)}
.mob-nav-icon{font-size:18px}

@media(max-width:768px){
  #sidebar{display:none}
  #mobile-nav{display:block}
  .content{padding:1.25rem;padding-bottom:80px}
  .goals-grid{grid-template-columns:repeat(2,1fr)}
  .field-row,.field-3{grid-template-columns:1fr}
  .search-bar{flex-direction:column}
  .profile-hero{flex-direction:column;text-align:center}
  .profile-hero::before{left:0;top:0;right:0;bottom:auto;width:auto;height:3px}
  .quick-actions{flex-direction:column}
  .qa-btn{min-width:auto}
  .topbar{display:none}
  .carrier-actions{position:static;margin-top:.875rem}
}
@media(min-width:769px) and (max-width:1100px){
  :root{--sidebar:200px}
  .goals-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── Animations ────────────────────────────────────────────── */
.fade-in{animation:fadeIn .2s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Divider ───────────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:1.5rem 0}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>

<!-- ── Toast container ──────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Modal ────────────────────────────────────────────────── -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- ── Login Screen ──────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-wm"><span>RILEY</span>COOPER GROUP</div>
    <div class="login-title">Agent<br><em>Portal.</em></div>
    <div class="login-sub">Private access only. If you received an invitation, sign in below. All activity is monitored and logged.</div>
    <div class="login-error" id="login-error"></div>
    <div class="field"><label>Email Address</label><input type="email" id="login-email" placeholder="you@rcgrp.co" autocomplete="email"></div>

function progBar(current, target, label, unit=''){

async function loadApp(user){
  currentUser=user;

  // Always show the app immediately — never block on profile load
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';

  // Set a safe default profile immediately so UI doesn't hang
  agentProfile={
    auth_id:user.id,
    email:user.email,
    full_name:user.email.split('@')[0],
    is_management:false,
    status:'active',
    id:null
  };

  // Now load the real profile before building nav
  try {
    // Try REST API directly with session token — most reliable method
    const session = await sb.auth.getSession();
    const token = session?.data?.session?.access_token;
    
    if(token){
      const res = await fetch(SUPABASE_URL+'/rest/v1/agents?auth_id=eq.'+user.id+'&select=*&limit=1', {
        headers:{
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer '+token,
          'Accept': 'application/json'
        }
      });
      if(res.ok){
        const rows = await res.json();
        if(Array.isArray(rows) && rows.length > 0){
          agentProfile = rows[0];
          // Update last login silently
          fetch(SUPABASE_URL+'/rest/v1/agents?id=eq.'+agentProfile.id, {
            method:'PATCH',
            headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},
            body:JSON.stringify({last_login_at:new Date().toISOString()})
          }).catch(()=>{});
        }
      }
    }
    
    // Fallback to supabase-js client
    if(!agentProfile.id){
      const {data} = await sb.from('agents').select('*').eq('auth_id',user.id).single();
      if(data) agentProfile = data;
    }
    
    // If still no record, create one (new agent first login)
    if(!agentProfile.id){
      const {data:newAgent} = await sb.from('agents').insert({
        auth_id:user.id,
        full_name:user.user_metadata?.full_name||user.email.split('@')[0],
        email:user.email,
        status:'active'
      }).select().single();
      if(newAgent) agentProfile = newAgent;
    }
  } catch(e){
    console.log('Profile load error (non-fatal):', e.message);
  }

  // Rebuild nav with correct role now that we have real profile
  buildNav();
  updateSidebarProfile();
  nav('dashboard');

  // Log login silently — never block on this
  if(agentProfile?.id){
    sb.from('activity_log').insert({agent_id:agentProfile.id,action_type:'login'}).catch(()=>{});
  }
}

async function searchLanes(){
  const origin=document.getElementById('s-origin').value;
  const dest=document.getElementById('s-dest').value;
  const equip=document.getElementById('s-equip').value;
  if(!origin||!dest){toast('Select origin and destination first','err');return;}
  const container=document.getElementById('search-results');
  container.innerHTML='<div class="no-results"><span class="spin" style="font-size:20px">⟳</span></div>';
  // Log search
  await sb.from('activity_log').insert({
    agent_id:agentProfile.id,action_type:'search',record_type:'lane',
    metadata:{origin,destination:dest,equipment:equip}
  });
  let q=sb.from('carrier_lanes')
    .select('*,carriers(*)')
    .eq('origin_region',origin)
    .eq('dest_region',dest)
    .order('load_count',{ascending:false})
    .limit(30);
  const {data,error}=await q;
  if(error){container.innerHTML=`<div class="no-results">Error: ${error.message}</div>`;return;}
  if(!data||!data.length){
    container.innerHTML=`<div class="no-results"><div style="font-size:24px;margin-bottom:.75rem">○</div>No carriers found on ${origin} → ${dest}.<br><span style="cursor:pointer;color:var(--red)" onclick="openAddCarrier()">Add the first one →</span></div>`;
    return;
  }
  // Filter by equipment if specified
  let results=data;
  if(equip){results=data.filter(r=>!r.carriers?.equipment_types||r.carriers.equipment_types.includes(equip)||r.carriers.equipment_types.length===0);}
  // Separate by status
  const active=results.filter(r=>!r.carriers||r.carriers.status==='active');
  const caution=results.filter(r=>r.carriers?.status==='caution');
  const blacklisted=results.filter(r=>r.carriers?.status==='blacklisted');
  container.innerHTML=`
    <div class="results-header">
      <span>${results.length} carrier${results.length!==1?'s':''} on ${origin} → ${dest}</span>
      <span>${equip?equip:'All equipment'}</span>
    </div>
    ${blacklisted.length?`<div style="margin-bottom:1rem"><div class="results-header" style="color:var(--signal)">⊗ Do Not Use (${blacklisted.length})</div>${blacklisted.map(r=>renderCarrierCard(r)).join('')}</div>`:''}
    ${caution.length?`<div style="margin-bottom:1rem"><div class="results-header" style="color:var(--amber)">⚠ Use With Caution (${caution.length})</div>${caution.map(r=>renderCarrierCard(r)).join('')}</div>`:''}
    ${active.map(r=>renderCarrierCard(r)).join('')}`;
}

function renderCarrierCard(lane){
  const c=lane.carriers||{};
  const status=c.status||'active';
  const statusBadge=status==='blacklisted'?`<span class="badge badge-blacklist">⊗ Do Not Use</span>`:
    status==='caution'?`<span class="badge badge-caution">⚠ Caution</span>`:
    c.potentially_inactive?`<span class="badge badge-inactive">Possibly Inactive</span>`:
    `<span class="badge badge-active">Active</span>`;
  const lastUsed=lane.last_used?new Date(lane.last_used).toLocaleDateString('en-CA',{year:'numeric',month:'short'}):'—';
  const firstUsed=lane.first_used?new Date(lane.first_used).getFullYear():'—';
  return `
    <div class="carrier-card ${status}" onclick="openCarrierDetail('${c.id||''}')">
      <div class="carrier-actions">
        ${status!=='blacklisted'?`<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openFlagCarrier('${c.id||''}','${(c.name||'').replace(/'/g,"\\'")}')">⚑ Flag</button>`:''}
      </div>

function calcProfit(){
  const rev=parseFloat(document.getElementById('ll-revenue').value)||0;
  const cost=parseFloat(document.getElementById('ll-cost').value)||0;
  const profit=rev-cost;
  const tier=(agentProfile?.comp_tier||50)/100;
  const commission=profit*tier;
  document.getElementById('ll-profit').textContent=profit>=0?fmtMoney(profit):`-${fmtMoney(Math.abs(profit))}`;
  document.getElementById('ll-profit').style.color=profit>=0?'var(--green)':'var(--signal)';
  document.getElementById('ll-commission').textContent=commission>=0?fmtMoney(commission):`-${fmtMoney(Math.abs(commission))}`;
}

async function submitLoad(){
  const carrierId=document.getElementById('ll-carrier').value;
  const oCity=document.getElementById('ll-ocity').value.trim();
  const oRegion=document.getElementById('ll-oregion').value;
  const dCity=document.getElementById('ll-dcity').value.trim();
  const dRegion=document.getElementById('ll-dregion').value;
  const date=document.getElementById('ll-date').value;
  const equip=document.getElementById('ll-equip').value;
  const revenue=parseFloat(document.getElementById('ll-revenue').value)||0;
  const cost=parseFloat(document.getElementById('ll-cost').value)||0;
  const notes=document.getElementById('ll-notes').value.trim();
  if(!carrierId||!oRegion||!dRegion||!date){toast('Please fill in carrier, regions, and date','err');return;}
  const profit=revenue-cost;
  const tier=(agentProfile?.comp_tier||50)/100;
  const commission=profit*tier;
  // Insert load
  const {data:load,error}=await sb.from('agent_loads').insert({
    agent_id:agentProfile.id,carrier_id:carrierId,
    origin_city:oCity,origin_region:oRegion,
    dest_city:dCity,dest_region:dRegion,
    ship_date:date,equipment_type:equip,
    revenue,carrier_cost:cost,profit,commission,notes
  }).select().single();
  if(error){
    // Table might not exist yet — create it
    if(error.code==='42P01'){toast('Creating loads table... please retry in a moment','err');await createAgentLoadsTable();return;}
    toast('Error saving load: '+error.message,'err');return;
  }
  // Update carrier lane stats
  if(oRegion&&dRegion&&carrierId){
    await sb.rpc('upsert_carrier_lane',{p_carrier_id:carrierId,p_origin:oRegion,p_dest:dRegion}).catch(()=>{});
  }
  // Update milestone progress
  await updateMilestoneProgress();
  toast('Load saved — well done!');
  nav('dashboard');
}

async function createAgentLoadsTable(){
  // This runs the SQL to create the agent_loads table if it doesn't exist
  await sb.rpc('create_agent_loads_if_not_exists').catch(()=>{});
}

async function updateMilestoneProgress(){
  // Get current period stats and update milestone current_value
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
  const {data:monthLoads}=await sb.from('agent_loads').select('loads,revenue,commission').eq('agent_id',agentProfile.id).gte('ship_date',monthStart);
  // Update monthly milestones
  const {data:monthMilestones}=await sb.from('agent_milestones').select('*').eq('agent_id',agentProfile.id).eq('period_type','monthly');
  if(monthMilestones&&monthLoads){
    const totalLoads=monthLoads.length;
    const totalRevenue=monthLoads.reduce((s,l)=>s+(l.revenue||0),0);
    const totalComm=monthLoads.reduce((s,l)=>s+(l.commission||0),0);
    for(const m of monthMilestones){
      const val=m.milestone_type==='loads'?totalLoads:m.milestone_type==='revenue'?totalRevenue:totalComm;
      await sb.from('agent_milestones').update({current_value:val}).eq('id',m.id);
    }
  }
}

function renderCarrierRow(c){

  const badge=status==='blacklisted'?'<span class="badge badge-blacklist">⊗ Do Not Use</span>':
    status==='caution'?'<span class="badge badge-caution">⚠ Caution</span>':
    c.potentially_inactive?'<span class="badge badge-inactive">Possibly Inactive</span>':
    '<span class="badge badge-active">Active</span>';
  return `
    <div class="carrier-card ${status}" style="margin-bottom:.5rem" onclick="openCarrierDetail('${c.id}')">
      <div class="carrier-actions">
        ${status!=='blacklisted'?`<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openFlagCarrier('${c.id}','${(c.name||'').replace(/'/g,"\\'")}')">⚑ Flag</button>`:''}

        ${c.contact_name?`<span>${c.contact_name}</span>`:''}
        ${c.total_loads_historical?`<span>${fmt(c.total_loads_historical)} historical loads</span>`:''}
        ${c.last_load_date?`<span>Last: ${new Date(c.last_load_date).toLocaleDateString('en-CA',{year:'numeric',month:'short'})}</span>`:''}
      </div>

}

function filterCarriers(q){
  if(!window._allCarriers)return;
  const filtered=q?window._allCarriers.filter(c=>c.name?.toLowerCase().includes(q.toLowerCase())||c.mc_number?.includes(q)||c.contact_name?.toLowerCase().includes(q.toLowerCase())):window._allCarriers;
  const active=filtered.filter(c=>c.status==='active');
  const el=document.getElementById('active-carriers');
  if(el)el.innerHTML=active.map(renderCarrierRow).join('');
}

async function submitFlag(carrierId, carrierName){
  const type=document.getElementById('flag-type').value;
  const reason=document.getElementById('flag-reason').value;
  const notes=document.getElementById('flag-notes').value.trim();
  if(!notes){toast('Please add a note explaining what happened','err');return;}
  const {error}=await sb.from('carrier_flags').insert({
    carrier_id:carrierId,flagged_by:agentProfile.id,
    flag_type:type,reason_category:reason,notes
  });
  if(error){toast('Error: '+error.message,'err');return;}
  // Update carrier status to caution if it's an agent flag
  if(type==='caution'){
    await sb.from('carriers').update({status:'caution',blacklist_reason_category:reason,blacklist_notes:notes,blacklist_severity:'caution'}).eq('id',carrierId);
  }
  await sb.from('activity_log').insert({agent_id:agentProfile.id,action_type:'flag_carrier',record_type:'carrier',record_id:carrierId,metadata:{flag_type:type,reason}});
  toast(`Flag submitted — management will review ${carrierName}`);

}

  </div>`;
  for(const period of periods){
    const pm=milestones?.filter(m=>m.period_type===period)||[];
    html+=`<div class="card" style="margin-bottom:1rem">
      <div class="section-header">
        <div class="card-title">${period.charAt(0).toUpperCase()+period.slice(1)} Goals</div>
        <button class="btn btn-ghost btn-sm" onclick="openSetGoal('${period}')">+ Set Goal</button>
      </div>`;
    if(!pm.length){
      html+=`<div style="font-size:13px;color:var(--dim)">No ${period} goals set yet.</div>`;
    } else {
      for(const m of pm){
        const unit=m.milestone_type==='loads'?' loads':m.milestone_type==='revenue'?' revenue':' commission';
        const p=pct(m.current_value||0,m.target_value||0);
        html+=`<div style="margin-bottom:1rem">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
            <div style="font-size:13px;font-weight:500;color:var(--text)">${m.title}</div>
            <div style="display:flex;gap:.5rem;align-items:center">
              <span style="font-family:var(--mono);font-size:10px;color:var(--dim)">${p}%</span>
              <button class="btn btn-ghost btn-sm" onclick="editGoal('${m.id}','${m.title}',${m.target_value},'${m.milestone_type}','${period}')">Edit</button>
            </div>
          </div>
          ${progBar(m.current_value||0,m.target_value||0,m.milestone_type.charAt(0).toUpperCase()+m.milestone_type.slice(1),unit)}
        </div>`;
      }
    }
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

async function saveGoal(period){
  const type=document.getElementById('goal-type').value;

  if(!target){toast('Enter a target value','err');return;}
  const titles={loads:`${period.charAt(0).toUpperCase()+period.slice(1)} Loads`,revenue:`${period.charAt(0).toUpperCase()+period.slice(1)} Revenue`,commission:`${period.charAt(0).toUpperCase()+period.slice(1)} Commission`};
  const {error}=await sb.from('agent_milestones').insert({
    agent_id:agentProfile.id,title:titles[type],

    period_type:period,current_value:0

  toast('Goal set');

async function updateGoal(id){

async function renderTasks(){
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="openAddTask()">+ Add Task</button>`;
  document.getElementById('content').innerHTML='<div class="empty"><span class="spin">⟳</span></div>';
  const {data}=await sb.from('agent_tasks').select('*').eq('agent_id',agentProfile.id).order('completed').order('due_date',{ascending:true,nullsFirst:false});
  const tasks=data||[];
  if(!tasks.length){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="empty-icon">☐</div><div class="empty-text">No tasks yet. Add one to stay on track.</div><button class="btn btn-primary" onclick="openAddTask()">Add Task</button></div>`;
    return;
  }
  const open=tasks.filter(t=>!t.completed);
  const done=tasks.filter(t=>t.completed);
  document.getElementById('content').innerHTML=`
    <div class="fade-in">
      <div class="card">
        <div class="section-header"><div class="card-title">Open (${open.length})</div></div>
        ${open.length?open.map(t=>renderTaskItem(t)).join(''):'<div style="font-size:13px;color:var(--dim)">All caught up.</div>'}
      </div>
      ${done.length?`<div class="card" style="margin-top:1rem"><div class="section-header"><div class="card-title">Completed (${done.length})</div></div>${done.map(t=>renderTaskItem(t)).join('')}</div>`:''}
    </div>`;
}

function renderTaskItem(t){
  const priorityClass=t.priority==='high'?'task-priority-high':t.priority==='urgent'?'task-priority-urgent':'';
  const due=t.due_date?new Date(t.due_date).toLocaleDateString('en-CA',{month:'short',day:'numeric'}):'';
  return `
    <div class="task-item ${priorityClass}">
      <div class="task-check ${t.completed?'done':''}" onclick="toggleTask('${t.id}',${t.completed},this)"></div>
      <div class="task-text ${t.completed?'done':''}">${t.title}${t.description?`<div style="font-size:11px;color:var(--dim);margin-top:.15rem">${t.description}</div>`:''}</div>
      ${due?`<div class="task-due">${due}</div>`:''}
      <button class="btn btn-ghost btn-sm" onclick="deleteTask('${t.id}')">✕</button>
    </div>`;
}

async function toggleTask(id, completed, el){
  const now=completed?null:new Date().toISOString();
  await sb.from('agent_tasks').update({completed:!completed,completed_at:now}).eq('id',id);
  renderTasks();
}

async function deleteTask(id){
  await sb.from('agent_tasks').delete().eq('id',id);
  renderTasks();
}

function openAddTask(){
  openModal(`
    <div class="field"><label>Task *</label><input type="text" id="task-title" placeholder="Follow up with carrier..."></div>
    <div class="field"><label>Details</label><input type="text" id="task-desc" placeholder="Optional details"></div>

      <div class="field"><label>Priority</label><select id="task-priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></div>

    <button class="btn btn-primary" style="width:100%" onclick="saveTask()">Add Task</button>
  `, 'Add Task');
}

async function saveTask(){
  const title=document.getElementById('task-title').value.trim();
  if(!title){toast('Enter a task','err');return;}
  await sb.from('agent_tasks').insert({
    agent_id:agentProfile.id,created_by:agentProfile.id,
    title,
    description:document.getElementById('task-desc').value.trim()||null,
    due_date:document.getElementById('task-due').value||null,
    priority:document.getElementById('task-priority').value
  });
  toast('Task added');closeModal();renderTasks();
}

function selectTier(tier, el){

async function previewPhoto(input){
  const file=input.files[0];
  if(!file)return;
  // Upload to Supabase Storage
  const ext=file.name.split('.').pop();
  const path=`avatars/${agentProfile.id}.${ext}`;
  const {data,error}=await sb.storage.from('agent-photos').upload(path,file,{upsert:true});
  if(error){toast('Photo upload failed: '+error.message,'err');return;}
  const {data:{publicUrl}}=sb.storage.from('agent-photos').getPublicUrl(path);
  window._photoUrl=publicUrl;
  toast('Photo ready — save profile to apply');
}

async function saveProfile(){
  const updates={
    full_name:document.getElementById('p-name').value.trim(),
    title:document.getElementById('p-title').value.trim(),
    phone:document.getElementById('p-phone').value.trim(),
    comp_tier:window._selectedTier||agentProfile?.comp_tier,
  };
  if(window._photoUrl)updates.photo_url=window._photoUrl;
  const {error}=await sb.from('agents').update(updates).eq('id',agentProfile.id);
  if(error){toast('Error: '+error.message,'err');return;}
  Object.assign(agentProfile,updates);
  updateSidebarProfile();
  toast('Profile updated');
}

        <div id="prog-h" style="display:none;margin-top:.875rem"><div style="height:3px;background:var(--border2)"><div id="fill-h" style="height:100%;background:var(--red);width:0%;transition:width .3s"></div></div><div id="log-h" style="font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:.4rem;max-height:80px;overflow-y:auto;line-height:1.8"></div></div>

      <button class="btn btn-primary" id="import-run-btn" style="width:100%;padding:.875rem;font-size:13px" onclick="runPortalImport()" disabled>Run Import</button>
      <div id="import-summary" style="display:none;margin-top:1.5rem;background:rgba(58,143,90,.08);border:1px solid rgba(58,143,90,.2);padding:1.5rem;text-align:center">
        <div style="font-family:var(--display);font-size:24px;font-weight:600;color:var(--green);margin-bottom:.5rem">Import Complete</div>
        <div id="import-summary-text" style="font-size:13px;color:var(--muted)"></div>
      </div>
    </div>`;

  // Re-declare file state scoped to this render
  window._importFiles={carriers:null,lanes:null,loads:null};
  window._importCarrierIds={};
}

function handleFile(input, key){
  const file=input.files[0]; if(!file)return;
  window._importFiles[key]=file;
  const ids={carriers:'c',lanes:'l',loads:'h'};
  const id=ids[key];
  document.getElementById(`fn-${id}`).textContent=file.name;
  document.getElementById(`dz-${id}`).style.borderColor='var(--green)';
  checkImportReady();
}

function handleDrop(e,key){
  e.preventDefault();
  const file=e.dataTransfer.files[0];
  if(!file)return;
  window._importFiles[key]=file;
  const ids={carriers:'c',lanes:'l',loads:'h'};
  const id=ids[key];
  document.getElementById(`fn-${id}`).textContent=file.name;
  document.getElementById(`dz-${id}`).style.borderColor='var(--green)';
  checkImportReady();
}

function checkImportReady(){
  const f=window._importFiles;
  document.getElementById('import-run-btn').disabled=!(f.carriers&&f.lanes&&f.loads);
}

async function runPortalImport(){
  const btn=document.getElementById('import-run-btn');
  btn.disabled=true; btn.textContent='Importing...';
  const BATCH=250;
  let totalC=0,totalL=0,totalH=0;
  function parseCSV(text){
    const lines=text.trim().split('\n');
    const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    return lines.slice(1).map(line=>{
      const vals=[];let cur='',inQ=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){vals.push(cur.trim());cur='';}else{cur+=ch;}
      }
      vals.push(cur.trim());
      const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||null;});
      return obj;
    }).filter(r=>Object.values(r).some(v=>v));
  }
  function setP(id,pct){document.getElementById(`fill-${id}`).style.width=pct+'%';}
  function addLog(id,msg){const el=document.getElementById(`log-${id}`);el.innerHTML+=msg+'\n';el.scrollTop=el.scrollHeight;}
  function setBadge(id,state,text){const el=document.getElementById(`badge-${id}`);el.style.background=state==='ok'?'rgba(58,143,90,.12)':state==='run'?'var(--red-dim)':'rgba(192,64,64,.12)';el.style.color=state==='ok'?'var(--green)':state==='run'?'var(--red)':'var(--signal)';el.textContent=text;}
  try{
    // Step 1: Carriers
    setBadge('c','run','Running...');
    document.getElementById('prog-c').style.display='block';
    const cText=await window._importFiles.carriers.text();
    const cRows=parseCSV(cText);
    addLog('c',`Parsing ${cRows.length} carriers...`);
    for(let i=0;i<cRows.length;i+=BATCH){
      const batch=cRows.slice(i,i+BATCH).map(r=>({name:r.carrier||r.name,total_loads_historical:parseInt(r.total_loads)||0,first_load_date:r.first_load||null,last_load_date:r.last_load||null,potentially_inactive:r.potentially_inactive==='True'||r.potentially_inactive==='true'})).filter(r=>r.name);
      const res=await fetch(`${SUPABASE_URL}/rest/v1/carriers`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=representation'},body:JSON.stringify(batch)});
      const data=await res.json();
      if(Array.isArray(data))data.forEach(c=>{window._importCarrierIds[c.name]=c.id;});
      totalC+=batch.length;setP('c',Math.round((totalC/cRows.length)*100));
    }
    setBadge('c','ok',`Done — ${totalC}`);
    addLog('c',`✓ ${totalC} carriers loaded`);
    // Step 2: Lanes
    setBadge('l','run','Running...');
    document.getElementById('prog-l').style.display='block';
    const lText=await window._importFiles.lanes.text();
    const lRows=parseCSV(lText);
    addLog('l',`Parsing ${lRows.length} lanes...`);
    for(let i=0;i<lRows.length;i+=BATCH){
      const batch=lRows.slice(i,i+BATCH).map(r=>{const cId=window._importCarrierIds[r.carrier];if(!cId)return null;return{carrier_id:cId,origin_region:r.origin_region,dest_region:r.dest_region,load_count:parseInt(r.load_count)||0,first_used:r.first_used||null,last_used:r.last_used||null};}).filter(Boolean);
      if(batch.length)await fetch(`${SUPABASE_URL}/rest/v1/carrier_lanes`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal'},body:JSON.stringify(batch)});
      totalL+=batch.length;setP('l',Math.round(((i+BATCH)/lRows.length)*100));
    }
    setBadge('l','ok',`Done — ${totalL}`);
    addLog('l',`✓ ${totalL} lanes loaded`);
    // Step 3: Loads
    setBadge('h','run','Running...');
    document.getElementById('prog-h').style.display='block';
    const hText=await window._importFiles.loads.text();
    const hRows=parseCSV(hText);
    addLog('h',`Parsing ${hRows.length} loads...`);
    for(let i=0;i<hRows.length;i+=BATCH){
      const batch=hRows.slice(i,i+BATCH).map(r=>({carrier_id:window._importCarrierIds[r.carrier]||null,carrier_name:r.carrier,origin_city:r.origin_city||null,origin_region:r.origin_region||null,dest_city:r.dest_city||null,dest_region:r.dest_region||null,ship_date:r.ship_date||null,del_date:r.del_date||null,status:r.status||null})).filter(r=>r.carrier_name);
      await fetch(`${SUPABASE_URL}/rest/v1/loads_historical`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal'},body:JSON.stringify(batch)});
      totalH+=batch.length;setP('h',Math.round((totalH/hRows.length)*100));
      if(totalH%2500===0||totalH===hRows.length)addLog('h',`${totalH.toLocaleString()} / ${hRows.length.toLocaleString()}`);
    }
    setBadge('h','ok',`Done — ${totalH}`);
    addLog('h',`✓ ${totalH.toLocaleString()} loads loaded`);
    // Done
    document.getElementById('import-summary').style.display='block';
    document.getElementById('import-summary-text').textContent=`${totalC.toLocaleString()} carriers · ${totalL.toLocaleString()} lanes · ${totalH.toLocaleString()} historical loads`;
    toast('Historical data imported successfully!');
  }catch(err){
    toast('Import error: '+err.message,'err');
    btn.disabled=false; btn.textContent='Retry Import';
  }
}

// ── Keyboard shortcut ─────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.key==='Escape')closeModal();
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();nav('search');}
});

// ── Enter key on login ────────────────────────────────────────
document.getElementById('login-password').addEventListener('keydown', e=>{if(e.key==='Enter')signIn();});
document.getElementById('login-email').addEventListener('keydown', e=>{if(e.key==='Enter')document.getElementById('login-password').focus();});

// ── Init ──────────────────────────────────────────────────────
(async ()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){await loadApp(session.user);}
})();
</script>
